[workspace]
resolver = "2"
members = ["crates/cigar-core", "crates/cigar-embed", "crates/cigar-storage", "crates/cigar-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/cigar"
authors = ["CIGAR contributors"]

[workspace.dependencies]
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
fs2 = "0.4"
globset = "0.4"
ignore = "0.4"
rayon = "1.12"
rusqlite = { version = "0.41", features = ["bundled", "functions", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlite-vec = "=0.1.7-alpha.10"
tempfile = "3.27"
thiserror = "2.0"
toml = "1.1"
toml_edit = "0.25"
walkdir = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace.lints.rust]
unsafe_code = "warn"
unused_qualifications = "warn"
rust_2018_idioms = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
