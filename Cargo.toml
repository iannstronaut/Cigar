[workspace]
resolver = "2"
members = ["crates/cigar-core", "crates/cigar-embed", "crates/cigar-storage", "crates/cigar-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MPL-2.0"
repository = "https://example.invalid/cigar"
authors = ["CIGAR contributors"]

[workspace.dependencies]
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
fs2 = "0.4"
globset = "0.4"
ignore = "0.4"
rayon = "1.12"
rusqlite = { version = "0.41", features = ["bundled", "functions", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
gix = { version = "0.90", default-features = false, features = ["max-performance", "index", "blob-diff", "revision", "sha1", "sha256"] }
thiserror = "2.0"
toml = "1.1"
toml_edit = "0.25"
walkdir = "2.5"

[profile.release]
# Thin LTO keeps cross-crate inlining without fat-LTO peak memory; codegen-units
# stays at Cargo's default so release builds fit in CI memory.
lto = "thin"
strip = "symbols"
panic = "abort"

[workspace.lints.rust]
unsafe_code = "warn"
unused_qualifications = "warn"
rust_2018_idioms = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
module_inception = "allow"
too_many_arguments = "allow"
needless_lifetimes = "allow"
field_reassign_with_default = "allow"
only_used_in_recursion = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
